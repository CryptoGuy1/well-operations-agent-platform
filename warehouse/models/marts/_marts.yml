version: 2

models:
  - name: dim_wellbore
    description: >
      One row per wellbore key (ADR 0002 D1): every Sodir wellbore and every technical sidetrack
      found in the Volve sources. is_heldout marks the wellbores held out by D8.
    columns:
      - name: wellbore_key
        data_tests: [unique, not_null]
      - name: wellbore_name
        data_tests: [not_null]
      - name: parent_key
        data_tests:
          - not_null:
              config:
                where: is_technical_sidetrack
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: is_technical_sidetrack
        data_tests: [not_null]
      - name: in_volve_field
        data_tests: [not_null]
      - name: is_heldout
        data_tests: [not_null]

  - name: fct_lost_time
    description: >
      Activity hours by wellbore, hole section, category, subcategory and lost-time tier
      (ADR 0002 D7). Tier 'none' for codes outside the lost_time_codes seed.
    data_tests:
      - unique:
          arguments:
            column_name: "section_id || '|' || category || ' -- ' || subcategory"
    columns:
      - name: wellbore_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: section_id
        data_tests: [not_null]
      - name: tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [primary, possible, none]
      - name: hours
        data_tests: [not_null, non_negative]

  - name: fct_production_monthly_reconciliation
    description: >
      Volve field production per month, one row per month, from three sources, each labelled
      with its basis (ADR 0002 D9): the workbook monthly sheet summed over wellbores, Sodir gross
      (sum wellbores) and Sodir net (saleable). Volumes in Sm3. Sodir publishes one produced-water
      column for both tables, so water gross and net are the same figure. Ratios are set only
      where both sides are non-zero. No source is treated as true.
    columns:
      - name: month_start
        data_tests: [unique, not_null]
      - name: oil_workbook_to_gross
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: oil_workbook_sm3
                denominator: oil_sodir_gross_sm3
      - name: oil_workbook_to_net
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: oil_workbook_sm3
                denominator: oil_sodir_net_sm3
      - name: oil_gross_to_net
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: oil_sodir_gross_sm3
                denominator: oil_sodir_net_sm3
      - name: gas_workbook_to_gross
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: gas_workbook_sm3
                denominator: gas_sodir_gross_sm3
      - name: gas_workbook_to_net
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: gas_workbook_sm3
                denominator: gas_sodir_net_sm3
      - name: gas_gross_to_net
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: gas_sodir_gross_sm3
                denominator: gas_sodir_net_sm3
      - name: water_workbook_to_gross
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: water_workbook_sm3
                denominator: water_sodir_gross_sm3
      - name: water_workbook_to_net
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: water_workbook_sm3
                denominator: water_sodir_net_sm3
      - name: water_gross_to_net
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: water_sodir_gross_sm3
                denominator: water_sodir_net_sm3

  - name: dim_hole_section
    description: >
      One row per hole section (int_ddr__hole_section) with operation_phase, activity hours,
      new_hole_drilled_m and bit_size_evidence_in. operation_phase is the activity category with
      the most hours in the section, ignoring interruption; ties go to drilling > formation
      evaluation > completion > workover > plug abandon > moving; a section with no hours outside
      interruption has 'none'.
    columns:
      - name: section_id
        data_tests: [unique, not_null]
      - name: operation_phase
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - drilling
                  - formation evaluation
                  - completion
                  - workover
                  - plug abandon
                  - moving
                  - none
      - name: activity_hours
        data_tests: [not_null, non_negative]
      - name: interruption_hours
        data_tests: [not_null, non_negative]
      - name: new_hole_drilled_m
        description: >
          The section's max md minus the wellbore's max md in earlier sections, floored at 0 and
          rounded to 0.01 m. The first section, or one whose earlier sections record no md, uses
          its stated start md instead. Null where the section records no md.
        data_tests: [non_negative]
      - name: bit_size_evidence_in
        description: >
          Evidence only, never used as hole size. The bit size (in, rounded to 1/8) of the latest
          WITSML bit run that started at or up to 7 days before the section's stated start; null
          where there is none or several sizes share that run start. See
          docs/data/hole-size-bit-source-experiment.md.
        data_tests: [non_negative]
