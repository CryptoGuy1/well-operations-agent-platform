version: 2

# Paths are relative to the repository root, where dbt runs (ADR 0003).
sources:
  - name: sodir
    description: Sodir FactPages tables parsed by src/well_ops/ingestion/sodir_factpages.py.
    meta:
      external_location: "data/staging/sodir/{name}.parquet"
    tables:
      - name: wellbore
        description: Every development and exploration wellbore on the Norwegian shelf.
      - name: field_production_net_monthly
        description: Saleable (net) production per field and month; fuel and flare deducted.
      - name: field_production_gross_monthly
        description: Sum-wellbores (gross) production per field and month.

  - name: identifiers
    description: Source well names resolved by src/well_ops/ingestion/identifiers.py.
    meta:
      external_location: "data/staging/identifiers/{name}.parquet"
    tables:
      - name: wellbore_alias
        description: One row per well name found in a Volve source (ADR 0002 D1, D2).

  - name: ddr
    description: Volve daily drilling reports parsed by src/well_ops/ingestion/volve_ddr.py.
    meta:
      external_location: "data/staging/ddr/{name}.parquet"
    tables:
      - name: report
        description: One row per drillReport file. Timestamps in UTC; -999.99 is null (D3, D5).
      - name: activity
        description: One row per activity in a report.

  - name: production
    description: >
      Volve production workbook parsed by src/well_ops/ingestion/volve_production.py. The text
      NULL and empty cells are null, with the columns listed in nulled_columns (D3).
    meta:
      external_location: "data/staging/production/{name}.parquet"
    tables:
      - name: daily
        description: One row per wellbore and day. The sheet states no units.
      - name: monthly
        description: One row per wellbore and month. The sheet's units row states hrs and Sm3.

  - name: evaluation
    description: Committed evaluation files.
    tables:
      - name: splits
        description: Held-out draw of ADR 0002 D8.
        meta:
          external_location: "evaluation/splits.json"
