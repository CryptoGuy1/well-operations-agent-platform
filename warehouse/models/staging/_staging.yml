version: 2

models:
  - name: stg_sodir__wellbore
    description: Sodir wellbores, renamed and cast. wellbore_key is the NPDID as text (D1).
    columns:
      - name: wellbore_key
        data_tests: [unique, not_null]
      - name: npdid
        data_tests: [unique, not_null]
      - name: source_table
        data_tests:
          - accepted_values:
              arguments:
                values: [development, exploration]

  - name: stg_identifiers__wellbore_alias
    description: Every well name found in a Volve source, with its D1 key and D2 status.
    data_tests:
      - unique:
          arguments:
            column_name: "source || '|' || source_name"
    columns:
      - name: match_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [npdid, name, none]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [wellbore, planning_object, not_a_wellbore, unresolved]
      - name: wellbore_key
        description: Set exactly when status is 'wellbore'.
        data_tests:
          - not_null:
              config:
                where: "status = 'wellbore'"
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
              config:
                where: "status = 'wellbore'"

  - name: stg_evaluation__heldout_wellbore
    description: D1 keys of the held-out wellbores (ADR 0002 D8). Keys only.
    columns:
      - name: wellbore_key
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key

  - name: stg_ddr__report
    description: One row per daily drilling report (ADR 0002 D3, D5).
    columns:
      - name: report_file
        data_tests: [unique, not_null]
      - name: wellbore_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: start_utc
        data_tests: [not_null]
      - name: end_utc
        data_tests: [not_null]
      - name: activities
        data_tests: [not_null, non_negative]
      - name: nulled_elements
        description: statusInfo elements given as -999.99 and staged as null (D3).

  - name: stg_ddr__activity
    description: One row per drilling report activity. activity_id is report_file#activity_number.
    columns:
      - name: activity_id
        data_tests: [unique, not_null]
      - name: report_file
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_ddr__report')
                field: report_file
      - name: wellbore_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: duration_hours
        data_tests: [not_null, non_negative]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completion
                  - drilling
                  - formation evaluation
                  - interruption
                  - moving
                  - plug abandon
                  - workover

  - name: stg_production__daily
    description: >
      Volve workbook daily sheet, one row per wellbore and day (D3). Volume units are decided by
      int_production__daily_units_check (D9).
    data_tests:
      - unique:
          arguments:
            column_name: "wellbore_key || '|' || production_date"
    columns:
      - name: wellbore_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: production_date
        data_tests: [not_null]

  - name: stg_production__monthly
    description: Volve workbook monthly sheet, one row per wellbore and month, in Sm3 (D3).
    data_tests:
      - unique:
          arguments:
            column_name: "wellbore_key || '|' || month_start"
    columns:
      - name: wellbore_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: month_start
        data_tests: [not_null]

  - name: stg_sodir__field_production_net_monthly
    description: Sodir saleable (net) production, all fields; units as published.
    data_tests:
      - unique:
          arguments:
            column_name: "field_npdid || '|' || month_start"
    columns:
      - name: field_npdid
        data_tests: [not_null]
      - name: month_start
        data_tests: [not_null]

  - name: stg_sodir__field_production_gross_monthly
    description: Sodir sum-wellbores (gross) production, all fields; units as published.
    data_tests:
      - unique:
          arguments:
            column_name: "field_npdid || '|' || month_start"
    columns:
      - name: field_npdid
        data_tests: [not_null]
      - name: month_start
        data_tests: [not_null]

  - name: stg_witsml__trajectory_station
    description: >
      Trajectory stations (D6). Angles in degrees from dega or rad; dogleg severity in degrees per 30 m.
    columns:
      - name: station_id
        data_tests: [unique, not_null]
      - name: alias_status
        description: D2 status of the WITSML wellbore name (alias table).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [wellbore, planning_object, not_a_wellbore, unresolved]
      - name: wellbore_key
        data_tests:
          - not_null:
              config:
                where: "alias_status = 'wellbore'"
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: md_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: tvd_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: incl_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['dega', 'rad']
      - name: azi_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['dega', 'rad']
      - name: disp_ns_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: disp_ew_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: dls_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['dega/30m', 'dega/m', 'rad/m']

  - name: stg_witsml__bha_run
    description: >
      One row per bhaRun object (D6). tubular_uid links to the tubular assembly.
    columns:
      - name: bha_run_id
        data_tests: [unique, not_null]
      - name: alias_status
        description: D2 status of the WITSML wellbore name (alias table).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [wellbore, planning_object, not_a_wellbore, unresolved]
      - name: wellbore_key
        data_tests:
          - not_null:
              config:
                where: "alias_status = 'wellbore'"
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: md_hole_start_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: md_hole_stop_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']

  - name: stg_witsml__tubular_component
    description: >
      Tubular components (D6). Diameters in inches, converted from m; -999.25 is read as null. Every component may carry a bitRecord, so dia_bit_in is a bit size only where type_tubular_comp names a bit.
    columns:
      - name: component_id
        data_tests: [unique, not_null]
      - name: alias_status
        description: D2 status of the WITSML wellbore name (alias table).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [wellbore, planning_object, not_a_wellbore, unresolved]
      - name: wellbore_key
        data_tests:
          - not_null:
              config:
                where: "alias_status = 'wellbore'"
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: id_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: od_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: len_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: dia_bit_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: dia_bit_in
        data_tests: [non_negative]
      - name: id_in
        data_tests: [non_negative]
      - name: od_in
        data_tests: [non_negative]
      - name: len_m
        data_tests: [non_negative]

  - name: stg_witsml__wb_geometry_section
    description: >
      Wellbore geometry sections (D6): hole and casing intervals. Diameters in inches, converted from m.
    columns:
      - name: geometry_section_id
        data_tests: [unique, not_null]
      - name: alias_status
        description: D2 status of the WITSML wellbore name (alias table).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [wellbore, planning_object, not_a_wellbore, unresolved]
      - name: wellbore_key
        data_tests:
          - not_null:
              config:
                where: "alias_status = 'wellbore'"
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: md_top_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: md_bottom_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: tvd_top_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: tvd_bottom_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: id_section_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: od_section_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']

  - name: stg_witsml__mud_log_interval
    description: >
      Mud log geology intervals (D6). Averages keep their published SI units. Lithology percentages are not staged.
    columns:
      - name: interval_id
        data_tests: [unique, not_null]
      - name: alias_status
        description: D2 status of the WITSML wellbore name (alias table).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [wellbore, planning_object, not_a_wellbore, unresolved]
      - name: wellbore_key
        data_tests:
          - not_null:
              config:
                where: "alias_status = 'wellbore'"
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: md_top_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: md_bottom_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']
      - name: rop_av_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m/s']
      - name: wob_av_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['N']
      - name: tq_av_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['N.m']
      - name: rpm_av_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['c/s']
      - name: wt_mud_av_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['kg/m3']
      - name: ecd_td_av_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['kg/m3']

  - name: stg_witsml__rig
    description: >
      One row per rig object (D6).
    columns:
      - name: rig_id
        data_tests: [unique, not_null]
      - name: alias_status
        description: D2 status of the WITSML wellbore name (alias table).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [wellbore, planning_object, not_a_wellbore, unresolved]
      - name: wellbore_key
        data_tests:
          - not_null:
              config:
                where: "alias_status = 'wellbore'"
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key

  - name: stg_witsml__message
    description: >
      WITSML messages (D6): time, depth, type, severity where present, and text.
    columns:
      - name: message_id
        data_tests: [unique, not_null]
      - name: alias_status
        description: D2 status of the WITSML wellbore name (alias table).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [wellbore, planning_object, not_a_wellbore, unresolved]
      - name: wellbore_key
        data_tests:
          - not_null:
              config:
                where: "alias_status = 'wellbore'"
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: md_uom
        data_tests:
          - accepted_values:
              arguments:
                values: ['m']

  - name: stg_witsml__log
    description: >
      One row per real-time log extracted on demand (D6), summarised over its chunk files:
      index type and range, and the number of data rows. log_id is
      <key>#<index folder>/<log folder>/<run folder>.
    columns:
      - name: log_id
        data_tests: [unique, not_null]
      - name: wellbore_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: index_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['measured depth', 'date time']
      - name: rows
        data_tests: [not_null, non_negative]

  - name: stg_witsml__log_curve
    description: One row per curve (mnemonic and unit) of each extracted log.
    columns:
      - name: log_curve_id
        data_tests: [unique, not_null]
      - name: log_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_witsml__log')
                field: log_id

  - name: stg_witsml__log_value
    description: >
      Curve values of extracted logs (D6), read from one Parquet file per log. Columns are the
      index curve and every curve under its mnemonic; units are in stg_witsml__log_curve. No
      curve mapping (ROP, WOB and so on) is applied.
    columns:
      - name: log_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_witsml__log')
                field: log_id
