version: 2

models:
  - name: int_ddr__report_flag
    description: >
      One row per D4 flag per daily drilling report (ADR 0002 D4, as amended). Flags mark
      doubtful records; nothing is corrected.
    columns:
      - name: report_flag_id
        data_tests: [unique, not_null]
      - name: report_file
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ddr__report')
                field: report_file
      - name: wellbore_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: flag
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - before_sodir_spud
                  - before_report_spud
                  - no_activities
                  - activity_gap_or_overlap
                  - depth_not_recorded

  - name: int_ddr__hole_section
    description: >
      Hole sections per wellbore from statusInfo diaHole, mdDiaHoleStart and dTimDiaHoleStart.
      Reports before the first stated diaHole form 'before_first_section'. A new dTimDiaHoleStart
      without a diaHole starts a section of unknown hole size. Within a section a missing diaHole
      carries the section's size forward; inferred_share is the share of such reports.
    columns:
      - name: section_id
        data_tests: [unique, not_null]
      - name: wellbore_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: section_label
        description: "'before_first_section', 'hole size unknown', or the hole size, e.g. '8.5 in'."
        data_tests: [not_null]
      - name: hole_size_source
        description: >
          Where hole_size_in comes from: 'report' (a stated diaHole in the section) or 'unknown'.
          Prompt 2.6 adds 'bit_size' from WITSML bhaRun and tubular objects, with precedence
          report > bit_size > unknown. Report comment text is not parsed for hole sizes.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['report', 'unknown']
      - name: report_count
        data_tests: [not_null]
      - name: inferred_share
        data_tests: [not_null, non_negative]

  - name: int_ddr__activity_section
    description: Each drilling report activity with the hole section active at its start time.
    columns:
      - name: activity_id
        data_tests: [unique, not_null]
      - name: section_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_ddr__hole_section')
                field: section_id

  - name: int_production__daily_units_check
    description: >
      Workbook daily volumes summed per wellbore and month (oil_daily_sm3, gas_daily_sm3,
      water_daily_sm3, from staged oil_volume, gas_volume, water_volume), against the monthly
      sheet (Sm3), with ratios daily / monthly where both sides are non-zero. Rule (ADR 0002 D9): a wellbore-month counts as non-zero for a quantity
      when either side is non-zero; it agrees when both are non-zero and the ratio is within 1 %
      of 1. If oil, gas and water each agree in at least 95 % of their non-zero months,
      daily_volume_unit is 'Sm3'; otherwise 'unknown'. Months present in one sheet only count as
      non-zero and not agreeing. Agreement is exact in every month, which indicates the monthly
      sheet is aggregated from the daily sheet; the check therefore confirms the daily sheet uses
      the monthly sheet's stated unit (Sm3), not an independent measurement.
    data_tests:
      - unique:
          arguments:
            column_name: "wellbore_key || '|' || month_start"
    columns:
      - name: wellbore_key
        data_tests: [not_null]
      - name: month_start
        data_tests: [not_null]
      - name: daily_volume_unit
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Sm3', 'unknown']
      - name: oil_ratio
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: oil_daily_sm3
                denominator: oil_monthly_sm3
      - name: gas_ratio
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: gas_daily_sm3
                denominator: gas_monthly_sm3
      - name: water_ratio
        data_tests:
          - ratio_requires_nonzero:
              arguments:
                numerator: water_daily_sm3
                denominator: water_monthly_sm3

  - name: int_production__daily_flag
    description: >
      Data-quality flags on workbook daily rows, one row per flag per wellbore and day. Flags
      mark doubtful records; values are kept as published. negative_volume: oil_sm3, gas_sm3,
      water_sm3 or water_injected_sm3 (staged oil_volume, gas_volume, water_volume,
      water_injected_volume) is below zero; detail lists the negative quantities.
    columns:
      - name: daily_flag_id
        data_tests: [unique, not_null]
      - name: wellbore_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: production_date
        data_tests: [not_null]
      - name: flag
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [negative_volume]

  - name: int_witsml__log_flag
    description: >
      Data-quality flags on extracted WITSML logs, one row per flag per log. Logs are kept.
      outside_report_period: a time-indexed log whose whole index range lies before the
      wellbore's first drilling report starts or after its last report ends.
    columns:
      - name: log_flag_id
        data_tests: [unique, not_null]
      - name: log_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_witsml__log')
                field: log_id
      - name: flag
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [outside_report_period]
