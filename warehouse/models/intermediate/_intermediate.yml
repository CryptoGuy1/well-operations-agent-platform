version: 2

models:
  - name: int_ddr__report_flag
    description: >
      One row per D4 flag per daily drilling report (ADR 0002 D4, as amended). Flags mark
      doubtful records; nothing is corrected.
    columns:
      - name: report_flag_id
        data_tests: [unique, not_null]
      - name: report_file
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ddr__report')
                field: report_file
      - name: wellbore_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_wellbore')
                field: wellbore_key
      - name: flag
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - before_sodir_spud
                  - before_report_spud
                  - no_activities
                  - activity_gap_or_overlap
                  - depth_not_recorded
